<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Dryf Kulis</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --radius: 280px;
            --planet-size: 160px;
            --space-blue: #a0c8ff;
        }

        @media (max-width: 768px) {
            :root { --radius: 180px; --planet-size: 110px; }
            .header { font-size: 14px !important; top: 20px !important; }
            .icon-content img { width: 55px !important; height: 55px !important; }
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: #020205;
            color: white;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SZUM (TV STATIC) --- */
        .tv-noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.04;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* --- GENEROWANE GWIAZDY --- */
        #star-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, #0a0e1f 0%, #020205 100%);
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }
        .twinkle { animation: twinkle-anim 3s infinite alternate; }
        @keyframes twinkle-anim { from { opacity: 0.2; } to { opacity: 1; } }

        /* --- SPADAJĄCE GWIAZDY --- */
        .shooting-star {
            position: absolute; width: 2px; height: 80px;
            background: linear-gradient(to bottom, transparent, white);
            opacity: 0; transform: rotate(45deg);
            z-index: -1;
        }

        /* --- NAGŁÓWEK --- */
        .header {
            position: absolute; top: 60px;
            color: var(--space-blue);
            text-transform: uppercase;
            letter-spacing: 5px; font-size: 20px;
            white-space: nowrap; overflow: hidden;
            border-right: 3px solid var(--space-blue);
            width: 0;
            animation: typing 2.5s steps(25, end) forwards, blink-caret 0.75s step-end infinite;
            text-shadow: 0 0 15px rgba(160, 200, 255, 0.5);
        }
        @keyframes typing { from { width: 0 } to { width: 310px; } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--space-blue); } }

        /* --- SCENA 3D (WYŚRODKOWANIE) --- */
        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            perspective: 2000px;
            cursor: grab;
        }

        /* Stage to martwy punkt */
        .stage {
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(15deg);
            display: flex; justify-content: center; align-items: center;
        }

        /* --- PLANETA --- */
        .white-planet {
            position: absolute;
            width: var(--planet-size); height: var(--planet-size);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d0e4ff 25%, #2563ff 65%, #050a15 100%);
            box-shadow: 
                inset -15px -15px 40px rgba(0, 0, 0, 0.9), 
                inset 10px 10px 25px rgba(255, 255, 255, 0.7), 
                0 0 60px rgba(80, 150, 255, 0.3);
            z-index: 1;
            transform: rotateX(-15deg); /* Prostujemy wizualnie kulę */
        }
        .white-planet::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#cracks) opacity(0.35); mix-blend-mode: overlay; border-radius: 50%;
        }

        /* --- IKONY --- */
        .orbit-container {
            position: absolute;
            transform-style: preserve-3d;
            display: flex; justify-content: center; align-items: center;
        }

        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            display: flex; flex-direction: column; align-items: center; width: 120px;
        }

        .icon-content {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: white;
        }

        .icon-content img {
            width: 80px; height: 80px; object-fit: contain;
            filter: grayscale(100%) brightness(0.8);
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .icon-content span {
            margin-top: 15px; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; width: 180px; text-align: center;
            color: white; opacity: 0; transition: 0.3s;
            text-shadow: 0 0 10px rgba(0,0,0,1);
        }

        .icon-content:hover img { filter: grayscale(0%) brightness(1.2); transform: scale(1.15); }
        .icon-content:hover span { opacity: 1; }

        .footer-instruction {
            position: absolute; bottom: 40px; font-size: 10px; letter-spacing: 4px;
            opacity: 0.3; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="tv-noise"></div>
    <div id="star-container"></div>

    <div class="header">planeta dryf kulis...</div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="cracks">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
            <feColorMatrix in="noise" type="saturate" values="0" />
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div class="scene" id="scene">
        <div class="stage">
            <div class="white-planet"></div>
            <div class="orbit-container" id="orbit">
                <!-- Ikony -->
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify"><span>Spotify</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="applemusic.png" alt="Apple Music"><span>Apple Music</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok"><span>TikTok</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"><span>Instagram</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="bandcamp.png" alt="Bandcamp"><span>Bandcamp</span></a></div>
            </div>
        </div>
    </div>

    <div class="footer-instruction">PRZESUŃ, ABY OBRÓCIĆ</div>

    <script>
        // --- GENERATOR GWIAZD ---
        const starContainer = document.getElementById('star-container');
        function createStars() {
            for (let i = 0; i < 400; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                if (Math.random() > 0.7) star.className += ' twinkle';
                
                const size = Math.random() * 2;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.opacity = Math.random();
                starContainer.appendChild(star);
            }
        }
        createStars();

        // --- SPADAJĄCE GWIAZDY ---
        function createShootingStar() {
            const star = document.createElement('div');
            star.className = 'shooting-star';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 50 + 'vh';
            document.body.appendChild(star);
            
            star.animate([
                { transform: 'translate(0, 0) rotate(45deg)', opacity: 0 },
                { opacity: 1, offset: 0.1 },
                { transform: 'translate(-600px, 600px) rotate(45deg)', opacity: 0 }
            ], { duration: 1500, easing: 'ease-in' });
            
            setTimeout(() => star.remove(), 1500);
        }
        setInterval(() => { if (Math.random() > 0.7) createShootingStar(); }, 3000);

        // --- LOGIKA PLANETY ---
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        const autoSpinSpeed = 0.12;

        function update() {
            if (!isDragging) { currentRotation += autoSpinSpeed; }

            const radius = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--radius'));

            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                const zPos = Math.cos(finalAngle * Math.PI / 180) * radius;

                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(${radius}px)`;
                
                // Ukrywanie ikon z tyłu
                if (zPos < -50) {
                    slot.style.opacity = "0.08";
                    slot.style.pointerEvents = "none";
                } else {
                    slot.style.opacity = "1";
                    slot.style.pointerEvents = "auto";
                    slot.style.zIndex = Math.round(zPos + 500);
                }
            });
            requestAnimationFrame(update);
        }

        // Obsługa myszy/dotyku
        function handleStart(e) { isDragging = true; startX = e.pageX || (e.touches ? e.touches[0].pageX : 0); }
        function handleEnd() { isDragging = false; }
        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
            const delta = (x - startX) * 0.25;
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        update();
    </script>
</body>
</html>
