<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Artysty</title>
    <style>
        :root {
            --radius: 280px; /* Zwiększyłem promień, żeby ikony miały więcej miejsca */
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Scena 3D */
        .scene {
            perspective: 1500px; /* Zwiększona głębia */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .scene:active {
            cursor: grabbing;
        }

        /* Kontener planety */
        .planet {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Slot na ikonę - to on trzyma pozycję w kole */
        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Sama ikona wewnątrz slotu */
        .icon-content {
            width: 100px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .icon-content img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            filter: grayscale(100%) opacity(0.6);
            transition: 0.4s;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
        }

        .icon-content span {
            margin-top: 8px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transition: 0.3s;
            white-space: nowrap;
        }

        /* Hover efekty */
        .icon-content:hover img {
            filter: grayscale(0%) opacity(1);
            transform: scale(1.2);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .icon-content:hover span {
            opacity: 1;
        }

        /* Instrukcja na dole */
        .instruction {
            position: absolute;
            bottom: 30px;
            font-size: 11px;
            opacity: 0.3;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Środek - poświata */
        .core {
            position: absolute;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="core"></div>
        <div class="planet" id="planet">
            <!-- Ikony zostaną wygenerowane/ustawione przez JS dla precyzji -->
            
            <div class="icon-slot" data-index="0">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify">
                    <span>Spotify</span>
                </a>
            </div>

            <div class="icon-slot" data-index="1">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/3844/3844727.png" alt="Apple Music">
                    <span>Apple Music</span>
                </a>
            </div>

            <div class="icon-slot" data-index="2">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                    <span>TikTok</span>
                </a>
            </div>

            <div class="icon-slot" data-index="3">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                    <span>Instagram</span>
                </a>
            </div>

            <div class="icon-slot" data-index="4">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/2504/2504743.png" alt="Bandcamp">
                    <span>Bandcamp</span>
                </a>
            </div>

        </div>
    </div>

    <div class="instruction">Chwyć i przesuń, aby obrócić</div>

    <script>
        const planet = document.getElementById('planet');
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        let autoSpin = 0.15; 

        // 1. Rozmieść ikony na starcie w okręgu
        function setupIcons() {
            slots.forEach((slot, i) => {
                const angle = (i / count) * 360;
                slot.dataset.angle = angle; // Zapisujemy kąt bazowy
                updateIconPosition(slot, angle, currentRotation);
            });
        }

        // 2. Funkcja aktualizująca pozycję konkretnej ikony
        function updateIconPosition(slot, baseAngle, rotation) {
            const finalAngle = baseAngle + rotation;
            // Slot wędruje po orbicie, a Icon-Content obraca się o -finalAngle, żeby zawsze patrzeć na nas
            slot.style.transform = `rotateY(${finalAngle}deg) translateZ(var(--radius))`;
            const content = slot.querySelector('.icon-content');
            content.style.transform = `rotateY(${-finalAngle}deg)`;
        }

        // 3. Główna pętla animacji
        function animate() {
            if (!isDragging) {
                currentRotation += autoSpin;
            }

            slots.forEach((slot) => {
                const baseAngle = parseFloat(slot.dataset.angle);
                updateIconPosition(slot, baseAngle, currentRotation);
            });

            requestAnimationFrame(animate);
        }

        // 4. Obsługa myszy i dotyku
        function handleStart(e) {
            isDragging = true;
            startX = e.pageX || e.touches[0].pageX;
        }

        function handleEnd() {
            isDragging = false;
        }

        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || e.touches[0].pageX;
            const delta = (x - startX) * 0.3; // Czułość
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);

        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        // Start
        setupIcons();
        animate();
    </script>
</body>
</html>
