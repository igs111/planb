<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Dryf Kulis</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Wartości domyślne (komputer) */
            --radius: 280px;
            --planet-size: 160px;
            --space-blue: #a0c8ff;
            --font-main: 'Space Mono', monospace;
        }

        /* Optymalizacja pod telefony */
        @media (max-width: 768px) {
            :root {
                --radius: 160px;
                --planet-size: 100px;
            }
            .header { font-size: 14px !important; top: 20px !important; }
            .icon-content img { width: 50px !important; height: 50px !important; }
            .footer-instruction { font-size: 8px !important; bottom: 20px !important; }
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: #020204;
            color: white;
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- NAPRAWIONY SZUM TELEWIZYJNY --- */
        .tv-noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.12;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            animation: noise-anim 0.2s steps(2) infinite;
        }

        @keyframes noise-anim {
            0% { transform: translate(0,0); }
            10% { transform: translate(-5%,-5%); }
            20% { transform: translate(10%,5%); }
            30% { transform: translate(-5%,10%); }
            40% { transform: translate(15%,-10%); }
            50% { transform: translate(-10%,15%); }
            60% { transform: translate(5%,-5%); }
            70% { transform: translate(15%,10%); }
            80% { transform: translate(-15%,5%); }
            90% { transform: translate(10%,-10%); }
            100% { transform: translate(0,0); }
        }

        /* --- NAGŁÓWEK Z ANIMACJĄ PISANIA --- */
        .header {
            position: absolute;
            top: 50px;
            text-align: center;
            color: var(--space-blue);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 20px;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid var(--space-blue); /* Kursor */
            width: 0;
            animation: 
                typing 2s steps(25, end) forwards,
                blink-caret 0.75s step-end infinite;
            text-shadow: 0 0 12px rgba(160, 200, 255, 0.7);
            z-index: 1000;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 320px; } /* Szerokość dopasowana do tekstu */
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--space-blue); }
        }

        /* --- SCENA I PLANETA --- */
        .scene {
            perspective: 2000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .stage {
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(12deg);
        }

        .white-planet {
            position: absolute;
            width: var(--planet-size);
            height: var(--planet-size);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d0e4ff 25%, #3066ff 60%, #050a15 100%);
            box-shadow: inset -10px -10px 30px rgba(0, 0, 0, 0.9), inset 10px 10px 20px rgba(255, 255, 255, 0.6), 0 0 50px rgba(100, 180, 255, 0.3);
            z-index: 1;
            transform: rotateX(-12deg);
        }

        .white-planet::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#cracks) opacity(0.3);
            mix-blend-mode: overlay;
            border-radius: 50%;
        }

        /* --- IKONY I NAPISY --- */
        .orbit-container {
            position: absolute;
            transform-style: preserve-3d;
        }

        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 120px;
        }

        .icon-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            text-align: center;
        }

        .icon-content img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: grayscale(100%) brightness(0.7);
            transition: 0.4s ease;
        }

        .icon-content span {
            margin-top: 15px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 180px;
            text-align: center;
            color: white; /* Napisy są teraz białe */
            opacity: 0;
            transition: 0.3s;
            text-shadow: 0 0 8px rgba(0,0,0,1);
        }

        .icon-content:hover img {
            filter: grayscale(0%) brightness(1.2);
            transform: scale(1.1);
        }
        .icon-content:hover span { opacity: 1; }

        /* --- INSTRUKCJA --- */
        .footer-instruction {
            position: absolute;
            bottom: 40px;
            font-size: 10px;
            letter-spacing: 4px;
            opacity: 0.3;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="tv-noise"></div>

    <div class="header">
        planeta dryf kulis...
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="cracks">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
            <feColorMatrix in="noise" type="saturate" values="0" />
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div class="scene" id="scene">
        <div class="stage">
            <div class="white-planet"></div>
            <div class="orbit-container" id="orbit">
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify"><span>Spotify</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="applemusic.png" alt="Apple Music"><span>Apple Music</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok"><span>TikTok</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"><span>Instagram</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="bandcamp.png" alt="Bandcamp"><span>Bandcamp</span></a></div>
            </div>
        </div>
    </div>

    <div class="footer-instruction">PRZESUŃ, ABY OBRÓCIĆ</div>

    <script>
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        const autoSpinSpeed = 0.15;

        function update() {
            if (!isDragging) {
                currentRotation += autoSpinSpeed;
            }

            // Pobieranie promienia z CSS (ważne przy zmianie rozmiaru okna/telefonu)
            const radius = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--radius'));

            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                const zPos = Math.cos(finalAngle * Math.PI / 180) * radius;

                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(${radius}px)`;
                
                if (zPos < -40) {
                    slot.style.opacity = "0.1";
                    slot.style.pointerEvents = "none";
                } else {
                    slot.style.opacity = "1";
                    slot.style.pointerEvents = "auto";
                    slot.style.zIndex = 10;
                }
            });

            requestAnimationFrame(update);
        }

        function handleStart(e) { isDragging = true; startX = e.pageX || e.touches[0].pageX; }
        function handleEnd() { isDragging = false; }
        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || e.touches[0].pageX;
            const delta = (x - startX) * 0.25;
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        update();
    </script>
</body>
</html>
