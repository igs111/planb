<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Artysty</title>
    <style>
        :root {
            --radius: 260px; /* Promień orbity */
            --planet-size: 120px; /* Rozmiar środkowej kuli */
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #080808;
            color: white;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Scena z pochyleniem */
        .scene {
            perspective: 2000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            /* To nadaje planecie kąt */
            transform: rotateX(25deg); 
        }

        .scene:active {
            cursor: grabbing;
        }

        /* Biała planeta w środku */
        .white-planet {
            position: absolute;
            width: var(--planet-size);
            height: var(--planet-size);
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            border-radius: 50%;
            box-shadow: 
                0 0 50px rgba(255, 255, 255, 0.4),
                inset -10px -10px 20px rgba(0,0,0,0.2);
            z-index: 1;
            /* Kontrujemy pochylenie sceny, żeby planeta była idealną kulą */
            transform: rotateX(-25deg);
        }

        /* Cień pod planetą */
        .planet-shadow {
            position: absolute;
            width: 150px;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            filter: blur(15px);
            transform: translateY(80px) rotateX(90deg);
            z-index: 0;
        }

        .orbit-container {
            position: relative;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s;
        }

        .icon-content {
            width: 90px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            transition: transform 0.3s ease;
        }

        .icon-content img {
            width: 70px;
            height: 70px;
            border-radius: 18px; /* Lekko zaokrąglone kwadraty dla nowoczesnego wyglądu */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            padding: 10px;
            filter: grayscale(100%) brightness(0.8);
            transition: 0.4s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .icon-content span {
            margin-top: 10px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transition: 0.3s;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* Efekty najechania */
        .icon-content:hover img {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.15) translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 30px rgba(255, 255, 255, 0.2);
        }

        .icon-content:hover span {
            opacity: 1;
        }

        .instruction {
            position: absolute;
            bottom: 40px;
            font-size: 10px;
            opacity: 0.3;
            letter-spacing: 5px;
            text-transform: uppercase;
            transform: rotateX(-25deg); /* Prostujemy tekst */
        }
    </style>
</head>
<body>

    <div class="scene" id="scene">
        <div class="planet-shadow"></div>
        <div class="white-planet"></div>
        
        <div class="orbit-container" id="orbit">
            
            <!-- Spotify -->
            <div class="icon-slot" data-index="0">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify">
                    <span>Spotify</span>
                </a>
            </div>

            <!-- Apple Music -->
            <div class="icon-slot" data-index="1">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/3844/3844727.png" alt="Apple Music">
                    <span>Apple Music</span>
                </a>
            </div>

            <!-- TikTok -->
            <div class="icon-slot" data-index="2">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                    <span>TikTok</span>
                </a>
            </div>

            <!-- Instagram -->
            <div class="icon-slot" data-index="3">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                    <span>Instagram</span>
                </a>
            </div>

            <!-- Bandcamp -->
            <div class="icon-slot" data-index="4">
                <a href="#" class="icon-content">
                    <img src="https://cdn-icons-png.flaticon.com/512/2504/2504743.png" alt="Bandcamp">
                    <span>Bandcamp</span>
                </a>
            </div>

        </div>

        <div class="instruction">Przesuń, aby obrócić</div>
    </div>

    <script>
        const orbit = document.getElementById('orbit');
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        let autoSpin = 0.1; 

        function updateIcons() {
            if (!isDragging) {
                currentRotation += autoSpin;
            }

            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                
                // Obliczamy pozycję Z, aby wiedzieć czy ikona jest z przodu czy z tyłu
                // Math.cos podaje wartość od -1 do 1
                const zPos = Math.cos(finalAngle * Math.PI / 180) * 260;
                const opacity = (zPos + 260) / 520; // Mapowanie -260/260 na 0/1

                // 1. Ustawienie pozycji slotu
                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(var(--radius))`;
                
                // 2. Kontr-rotacja treści (aby zawsze patrzyła na nas) + korekta pochylenia sceny
                const content = slot.querySelector('.icon-content');
                content.style.transform = `rotateY(${-finalAngle}deg) rotateX(-25deg)`;

                // 3. Naprawa "Bugowania" kliknięć i widoczności
                // Jeśli zPos < 0, ikona jest za białą kulą
                if (zPos < -50) {
                    slot.style.opacity = opacity + 0.2;
                    slot.style.pointerEvents = "none"; // Nie blokuje kliknięć
                    slot.style.zIndex = 0;
                } else {
                    slot.style.opacity = 1;
                    slot.style.pointerEvents = "auto"; // Można klikać
                    slot.style.zIndex = 10;
                }
            });

            requestAnimationFrame(updateIcons);
        }

        // Mouse/Touch Events
        function handleStart(e) {
            isDragging = true;
            startX = e.pageX || e.touches[0].pageX;
        }

        function handleEnd() {
            isDragging = false;
        }

        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || e.touches[0].pageX;
            const delta = (x - startX) * 0.3;
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        // Start
        updateIcons();
    </script>
</body>
</html>
