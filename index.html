<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Dryf Kulis</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --radius: 280px;
            --planet-size: 160px;
            --space-blue: #a0c8ff;
        }

        @media (max-width: 768px) {
            :root { --radius: 160px; --planet-size: 100px; }
            .header { font-size: 14px !important; top: 20px !important; }
            .icon-content img { width: 55px !important; height: 55px !important; }
        }

        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #080b1a 0%, #010103 100%);
            color: white;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- SUBTELNY SZUM --- */
        .tv-noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.03;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* --- GENERATOR GWIAZD (Paralaksa) --- */
        .star-field {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* Warstwa 1: Drobny pył gwiezdny */
        .stars-small {
            width: 1px; height: 1px;
            background: transparent;
            box-shadow: 454px 108px #FFF , 1801px 1867px #FFF , 1482px 512px #FFF , 856px 1456px #FFF , 256px 256px #FFF , 1123px 154px #FFF , 1654px 112px #FFF , 543px 876px #FFF , 1200px 300px #FFF , 400px 1500px #FFF , 900px 200px #FFF , 100px 1100px #FFF , 1700px 900px #FFF , 350px 750px #FFF , 1450px 1350px #FFF , 600px 100px #FFF;
            /* Tu w prawdziwym kodzie byłoby setki cieni, symulujemy je animacją */
            animation: drift 100s linear infinite;
        }
        .stars-small::after {
            content: " "; position: absolute; top: 2000px; width: 1px; height: 1px;
            box-shadow: 454px 108px #FFF , 1801px 1867px #FFF , 1482px 512px #FFF , 856px 1456px #FFF , 256px 256px #FFF , 1123px 154px #FFF;
        }

        /* Warstwa 2: Średnie migoczące gwiazdy */
        .stars-medium {
            width: 2px; height: 2px;
            background: transparent;
            box-shadow: 800px 400px #FFF , 200px 900px #FFF , 1400px 600px #FFF , 500px 100px #FFF , 1100px 1200px #FFF , 1600px 200px #FFF , 300px 1500px #FFF , 1000px 800px #FFF;
            animation: twinkle 4s infinite alternate, drift 150s linear infinite;
        }

        @keyframes drift {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }

        @keyframes twinkle {
            0% { opacity: 0.2; }
            100% { opacity: 0.8; }
        }

        /* --- SPADAJĄCE GWIAZDY --- */
        .shooting-star {
            position: absolute; top: 0; left: 50%; width: 2px; height: 80px;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,1));
            opacity: 0; transform: rotate(45deg);
            animation: shoot 12s infinite ease-in;
        }
        .shooting-star:nth-child(2) { animation-delay: 4s; left: 20%; animation-duration: 18s; }
        .shooting-star:nth-child(3) { animation-delay: 8s; left: 80%; animation-duration: 15s; }

        @keyframes shoot {
            0% { transform: translate(300px, -300px) rotate(45deg); opacity: 0; }
            5% { opacity: 1; }
            10% { transform: translate(-800px, 800px) rotate(45deg); opacity: 0; }
            100% { transform: translate(-800px, 800px) rotate(45deg); opacity: 0; }
        }

        /* --- NAGŁÓWEK --- */
        .header {
            position: absolute; top: 50px; color: var(--space-blue);
            text-transform: uppercase; letter-spacing: 4px; font-size: 20px;
            white-space: nowrap; overflow: hidden; border-right: 3px solid var(--space-blue);
            width: 0; animation: typing 2s steps(25, end) forwards, blink-caret 0.75s step-end infinite;
            text-shadow: 0 0 10px rgba(160, 200, 255, 0.5); z-index: 1000;
        }
        @keyframes typing { from { width: 0 } to { width: 310px; } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--space-blue); } }

        /* --- SCENA I PLANETA --- */
        .scene {
            perspective: 2000px; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; cursor: grab;
        }
        .scene:active { cursor: grabbing; }

        .stage { position: relative; transform-style: preserve-3d; transform: rotateX(12deg); }

        .white-planet {
            position: absolute; width: var(--planet-size); height: var(--planet-size);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d0e4ff 25%, #2055ff 65%, #050a15 100%);
            box-shadow: inset -10px -10px 30px rgba(0, 0, 0, 0.9), inset 10px 10px 20px rgba(255, 255, 255, 0.6), 0 0 60px rgba(80, 150, 255, 0.3);
            z-index: 1; transform: rotateX(-12deg);
        }
        .white-planet::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#cracks) opacity(0.3); mix-blend-mode: overlay; border-radius: 50%;
        }

        /* --- IKONY --- */
        .orbit-container { position: absolute; transform-style: preserve-3d; }
        .icon-slot {
            position: absolute; transform-style: preserve-3d;
            display: flex; flex-direction: column; align-items: center; justify-content: center; width: 120px;
        }
        .icon-content {
            display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: white; text-align: center;
        }
        .icon-content img {
            width: 80px; height: 80px; object-fit: contain;
            filter: grayscale(100%) brightness(0.75);
            transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        .icon-content span {
            margin-top: 15px; font-size: 10px; letter-spacing: 2px;
            text-transform: uppercase; width: 180px; text-align: center;
            color: white; opacity: 0; transition: 0.3s;
            text-shadow: 0 0 10px rgba(0,0,0,1);
        }
        .icon-content:hover img { filter: grayscale(0%) brightness(1.2); transform: scale(1.1); }
        .icon-content:hover span { opacity: 1; }

        .footer-instruction {
            position: absolute; bottom: 40px; font-size: 10px; letter-spacing: 4px;
            opacity: 0.3; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="tv-noise"></div>
    
    <!-- WIĘCEJ GWIAZD -->
    <div class="star-field">
        <div class="stars-small"></div>
        <div class="stars-medium"></div>
    </div>
    
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

    <div class="header">planeta dryf kulis...</div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="cracks">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
            <feColorMatrix in="noise" type="saturate" values="0" />
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div class="scene" id="scene">
        <div class="stage">
            <div class="white-planet"></div>
            <div class="orbit-container" id="orbit">
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify"><span>Spotify</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="applemusic.png" alt="Apple Music"><span>Apple Music</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok"><span>TikTok</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"><span>Instagram</span></a></div>
                <div class="icon-slot"><a href="#" class="icon-content"><img src="bandcamp.png" alt="Bandcamp"><span>Bandcamp</span></a></div>
            </div>
        </div>
    </div>

    <div class="footer-instruction">PRZESUŃ, ABY OBRÓCIĆ</div>

    <script>
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        const autoSpinSpeed = 0.12;

        function update() {
            if (!isDragging) { currentRotation += autoSpinSpeed; }
            const radius = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--radius'));
            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                const zPos = Math.cos(finalAngle * Math.PI / 180) * radius;
                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(${radius}px)`;
                if (zPos < -40) {
                    slot.style.opacity = "0.08"; slot.style.pointerEvents = "none";
                } else {
                    slot.style.opacity = "1"; slot.style.pointerEvents = "auto"; slot.style.zIndex = 10;
                }
            });
            requestAnimationFrame(update);
        }

        function handleStart(e) { isDragging = true; startX = e.pageX || (e.touches ? e.touches[0].pageX : 0); }
        function handleEnd() { isDragging = false; }
        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || (e.touches ? e.touches[0].pageX : 0);
            const delta = (x - startX) * 0.25;
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        update();
    </script>
</body>
</html>
