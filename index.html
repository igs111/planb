<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Artysty</title>
    <!-- Kosmiczna czcionka z Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --radius: 280px;
            --planet-size: 160px;
            --space-blue: #a0c8ff; /* Ten sam błękit co z planety */
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #020204;
            color: white;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
            user-select: none;
        }

        /* --- TELEWIZYJNY SZUM (TV STATIC) NA CAŁEJ STRONIE --- */
        body::after {
            content: "";
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/5/5a/Static_noise.png');
            opacity: 0.08; /* Subtelny, ale widoczny na wszystkim */
            pointer-events: none;
            z-index: 9999;
            animation: tv-static 0.2s steps(4) infinite;
        }

        @keyframes tv-static {
            0% { transform: translate(0,0); }
            25% { transform: translate(-1%, -1%); }
            50% { transform: translate(-2%, 1%); }
            75% { transform: translate(1%, -2%); }
            100% { transform: translate(-1%, 2%); }
        }

        /* --- NAGŁÓWEK --- */
        .header {
            position: absolute;
            top: 40px;
            text-align: center;
            color: var(--space-blue);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(160, 200, 255, 0.6);
            z-index: 1000;
        }

        .dots span {
            animation: blink 1.5s infinite;
            opacity: 0;
        }
        .dots span:nth-child(2) { animation-delay: 0.5s; }
        .dots span:nth-child(3) { animation-delay: 1s; }

        @keyframes blink {
            50% { opacity: 1; }
        }

        /* --- INSTRUKCJA NA DOLE --- */
        .footer-instruction {
            position: absolute;
            bottom: 40px;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.4;
            color: white;
            z-index: 1000;
        }

        /* --- PLANETA I SCENA --- */
        .scene {
            perspective: 2000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }

        .stage {
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(15deg);
        }

        .white-planet {
            position: absolute;
            width: var(--planet-size);
            height: var(--planet-size);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #d0e4ff 25%, #4076ff 60%, #051025 100%);
            box-shadow: inset -15px -15px 40px rgba(0, 0, 0, 0.9), inset 10px 10px 25px rgba(255, 255, 255, 0.7), 0 0 60px rgba(100, 180, 255, 0.4);
            z-index: 1;
            transform: rotateX(-15deg);
        }
        
        .white-planet::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#cracks) opacity(0.35);
            mix-blend-mode: overlay;
            border-radius: 50%;
        }

        /* --- IKONY --- */
        .orbit-container {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
        }

        .icon-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
        }

        .icon-content img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: grayscale(100%) brightness(0.8);
            transition: 0.4s ease;
        }

        .icon-content span {
            margin-top: 15px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            width: 200px;
            text-align: center;
            opacity: 0;
            transition: 0.3s;
            color: var(--space-blue);
        }

        .icon-content:hover img {
            filter: grayscale(0%) brightness(1.2);
            transform: scale(1.1);
        }
        .icon-content:hover span { opacity: 1; }

    </style>
</head>
<body>

    <div class="header">
        planeta dryf kulis<span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="cracks">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
            <feColorMatrix in="noise" type="saturate" values="0" />
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div class="scene" id="scene">
        <div class="stage">
            <div class="white-planet"></div>
            <div class="orbit-container" id="orbit">
                <!-- Spotify -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify">
                        <span>Spotify</span>
                    </a>
                </div>
                <!-- Apple Music -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="applemusic.png" alt="Apple Music">
                        <span>Apple Music</span>
                    </a>
                </div>
                <!-- TikTok -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                        <span>TikTok</span>
                    </a>
                </div>
                <!-- Instagram -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                        <span>Instagram</span>
                    </a>
                </div>
                <!-- Bandcamp -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="bandcamp.png" alt="Bandcamp">
                        <span>Bandcamp</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="footer-instruction">PRZESUŃ, ABY OBRÓCIĆ</div>

    <script>
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        const autoSpinSpeed = 0.15;

        function update() {
            if (!isDragging) {
                currentRotation += autoSpinSpeed;
            }

            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                const zPos = Math.cos(finalAngle * Math.PI / 180) * 280;

                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(var(--radius))`;
                
                if (zPos < -40) {
                    slot.style.opacity = "0.1";
                    slot.style.pointerEvents = "none";
                } else {
                    slot.style.opacity = "1";
                    slot.style.pointerEvents = "auto";
                    slot.style.zIndex = 10;
                }
            });

            requestAnimationFrame(update);
        }

        function handleStart(e) { isDragging = true; startX = e.pageX || e.touches[0].pageX; }
        function handleEnd() { isDragging = false; }
        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || e.touches[0].pageX;
            const delta = (x - startX) * 0.25;
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        update();
    </script>
</body>
</html>
