<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Artysty</title>
    <style>
        :root {
            --radius: 280px;
            --planet-size: 150px;
            --glow-color: rgba(100, 180, 255, 0.6);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050505;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* SZUM / GRAIN */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.1;
            pointer-events: none;
            z-index: 100;
        }

        .scene {
            perspective: 2000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }

        /* KONTENER PLANETY I ORBITY (WYŚRODKOWANY) */
        .stage {
            position: relative;
            width: 0;
            height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(20deg); /* Pochylenie całej sceny */
            transform-style: preserve-3d;
        }

        /* PLANETA - ŚWIECĄCA KULA */
        .white-planet {
            position: absolute;
            width: var(--planet-size);
            height: var(--planet-size);
            background: radial-gradient(circle at 30% 30%, #ffffff, #b0d4ff);
            border-radius: 50%;
            z-index: 1;
            /* Efekt świecenia */
            box-shadow: 
                0 0 40px var(--glow-color),
                0 0 100px rgba(255, 255, 255, 0.2),
                inset -10px -10px 30px rgba(0,0,0,0.3);
            filter: url(#cracks); /* Pęknięcia */
            transform: rotateX(-20deg); /* Prostujemy ją wizualnie */
        }

        /* ORBITA */
        .orbit-container {
            position: absolute;
            transform-style: preserve-3d;
            width: 0; height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            width: 120px; /* Stała szerokość slotu dla centrowania */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .icon-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            width: 100%;
        }

        .icon-content img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: grayscale(100%) brightness(0.8);
            transition: 0.4s ease;
        }

        .icon-content span {
            margin-top: 12px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-align: center;
            width: 200px; /* Szeroki kontener na tekst by się nie łamał */
            opacity: 0;
            transition: 0.3s;
        }

        /* HOVER */
        .icon-content:hover img {
            filter: grayscale(0%) brightness(1.2);
            transform: scale(1.1);
        }
        .icon-content:hover span {
            opacity: 1;
        }

    </style>
</head>
<body>

    <!-- Filtry SVG dla pęknięć -->
    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="cracks">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
            <feDiffuseLighting in="noise" lighting-color="#a0c8ff" surfaceScale="3">
                <feDistantLight azimuth="45" elevation="50" />
            </feDiffuseLighting>
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div class="scene" id="scene">
        <div class="stage">
            <div class="white-planet"></div>
            
            <div class="orbit-container" id="orbit">
                <!-- Spotify -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify">
                        <span>Spotify</span>
                    </a>
                </div>

                <!-- Apple Music -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="applemusic.png" alt="Apple Music">
                        <span>Apple Music</span>
                    </a>
                </div>

                <!-- TikTok -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                        <span>TikTok</span>
                    </a>
                </div>

                <!-- Instagram -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                        <span>Instagram</span>
                    </a>
                </div>

                <!-- Bandcamp -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="bandcamp.png" alt="Bandcamp">
                        <span>Bandcamp</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const orbit = document.getElementById('orbit');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        const autoSpinSpeed = 0.15; // Stała prędkość obrotu

        function update() {
            if (!isDragging) {
                currentRotation += autoSpinSpeed;
            }

            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                
                // Pozycja Z dla logiki klikania (ikony z tyłu są nieklikalne)
                const zPos = Math.cos(finalAngle * Math.PI / 180) * 280;
                
                // Obrót slotu wokół planety
                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(var(--radius))`;
                
                // Widoczność ikon z tyłu
                if (zPos < -20) {
                    slot.style.opacity = "0.3";
                    slot.style.pointerEvents = "none";
                } else {
                    slot.style.opacity = "1";
                    slot.style.pointerEvents = "auto";
                }
            });

            requestAnimationFrame(update);
        }

        // Obsługa myszki
        function handleStart(e) {
            isDragging = true;
            startX = e.pageX || e.touches[0].pageX;
        }

        function handleEnd() {
            isDragging = false;
        }

        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || e.touches[0].pageX;
            const delta = (x - startX) * 0.25; // Czułość przesuwania
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        update();
    </script>
</body>
</html>
