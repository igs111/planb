<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planeta Artysty - Final</title>
    <style>
        :root {
            --radius: 280px; /* Odległość ikon od środka */
            --planet-size: 160px;
            --glow-color: rgba(100, 180, 255, 0.4);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #030305;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* SZUM (GRAIN) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://grainy-gradients.vercel.app/noise.svg');
            opacity: 0.12;
            pointer-events: none;
            z-index: 1000;
        }

        .scene {
            perspective: 2000px;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }

        /* GŁÓWNY KONTENER 3D */
        .stage {
            position: relative;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotateX(15deg);
        }

        /* REALISTYCZNA KULA (RENDER) */
        .white-planet {
            position: absolute;
            width: var(--planet-size);
            height: var(--planet-size);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                #ffffff 0%, 
                #d0e4ff 25%, 
                #6096ff 60%, 
                #051025 100%
            );
            box-shadow: 
                inset -15px -15px 40px rgba(0, 0, 0, 0.9),
                inset 10px 10px 25px rgba(255, 255, 255, 0.7),
                0 0 60px var(--glow-color);
            z-index: 1;
            transform: rotateX(-15deg); /* Prostujemy wizualnie kulę */
        }

        /* Odblask światła na kuli */
        .white-planet::before {
            content: "";
            position: absolute;
            top: 15%; left: 15%;
            width: 35%; height: 25%;
            background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 80%);
            border-radius: 50%;
            filter: blur(4px);
        }

        /* Pęknięcia na kuli */
        .white-planet::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            filter: url(#cracks) opacity(0.3);
            mix-blend-mode: overlay;
            border-radius: 50%;
        }

        /* ORBITA */
        .orbit-container {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-slot {
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100px;
            /* translateZ będzie aplikowany przez JS */
        }

        .icon-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: white;
            text-align: center;
        }

        .icon-content img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: grayscale(100%) brightness(0.8) drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: 0.4s ease;
        }

        .icon-content span {
            margin-top: 12px;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            width: 200px; /* Zapobiega łamaniu tekstu */
            display: block;
            text-align: center;
            opacity: 0;
            transition: 0.3s;
            text-shadow: 0 5px 10px rgba(0,0,0,0.8);
        }

        /* HOVER */
        .icon-content:hover img {
            filter: grayscale(0%) brightness(1.2);
            transform: scale(1.15);
        }
        .icon-content:hover span {
            opacity: 1;
        }

    </style>
</head>
<body>

    <!-- Filtry SVG -->
    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="cracks">
            <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise" />
            <feColorMatrix in="noise" type="saturate" values="0" />
            <feComposite operator="in" in2="SourceGraphic" />
        </filter>
    </svg>

    <div class="scene" id="scene">
        <div class="stage">
            
            <div class="white-planet"></div>
            
            <div class="orbit-container" id="orbit">
                <!-- Spotify -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174872.png" alt="Spotify">
                        <span>Spotify</span>
                    </a>
                </div>

                <!-- Apple Music -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="applemusic.png" alt="Apple Music">
                        <span>Apple Music</span>
                    </a>
                </div>

                <!-- TikTok -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="TikTok">
                        <span>TikTok</span>
                    </a>
                </div>

                <!-- Instagram -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram">
                        <span>Instagram</span>
                    </a>
                </div>

                <!-- Bandcamp -->
                <div class="icon-slot">
                    <a href="#" class="icon-content">
                        <img src="bandcamp.png" alt="Bandcamp">
                        <span>Bandcamp</span>
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const slots = document.querySelectorAll('.icon-slot');
        const count = slots.length;
        
        let isDragging = false;
        let startX;
        let currentRotation = 0;
        const autoSpinSpeed = 0.15;

        function update() {
            if (!isDragging) {
                currentRotation += autoSpinSpeed;
            }

            slots.forEach((slot, i) => {
                const baseAngle = (i / count) * 360;
                const finalAngle = baseAngle + currentRotation;
                
                // Obliczamy Z, by ukrywać ikony z tyłu
                const zPos = Math.cos(finalAngle * Math.PI / 180) * 280;

                // Kluczowa poprawka: transformacja slotu
                // rotateY ustawia kąt na orbicie, a translateZ wypycha ikonę od środka
                slot.style.transform = `rotateY(${finalAngle}deg) translateZ(var(--radius))`;
                
                // Ustawienia klikalności i widoczności tyłu
                if (zPos < -40) {
                    slot.style.opacity = "0.2";
                    slot.style.pointerEvents = "none";
                } else {
                    slot.style.opacity = "1";
                    slot.style.pointerEvents = "auto";
                    slot.style.zIndex = 10;
                }
            });

            requestAnimationFrame(update);
        }

        // Obsługa myszy/dotyku
        function handleStart(e) {
            isDragging = true;
            startX = e.pageX || e.touches[0].pageX;
        }

        function handleEnd() { isDragging = false; }

        function handleMove(e) {
            if (!isDragging) return;
            const x = e.pageX || e.touches[0].pageX;
            const delta = (x - startX) * 0.25;
            currentRotation += delta;
            startX = x;
        }

        scene.addEventListener('mousedown', handleStart);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('mousemove', handleMove);
        scene.addEventListener('touchstart', handleStart);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('touchmove', handleMove);

        update();
    </script>
</body>
</html>
